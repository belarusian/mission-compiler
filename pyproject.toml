[project]
name = "mission-compiler"
version = "0.1.0"
description = "Deterministic CLI tool that composes four pipeline launches from a free-text mission description."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mission_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
